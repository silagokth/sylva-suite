syntax = "proto3";

package ss.sylva.ds.sdf;

import "proto/AlimpLib.proto";

message ImplementationDataFlowGraph {
  repeated Vertex vertices = 1;
  repeated Edge edges = 2;
}

message Vertex {
  int32 id = 1;
  string func = 2;
  string instance = 3;
  repeated Port input_ports = 4;
  repeated Port output_ports = 5;
}

message Edge {
  int32 id = 1;
  int32 src_id = 2;
  int32 dst_id = 3;
  string src_port = 4;
  string dst_port = 5;
}

message Port { repeated alimplib.DataChunk data_chunks = 1; }

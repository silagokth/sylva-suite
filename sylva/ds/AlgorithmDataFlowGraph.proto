syntax = "proto3";

package ss.sylva.sdf;

message AlgorithmDataFlowGraph {
  repeated Vertex vertices = 1;
  repeated Edge edges = 2;
}

message Vertex {
  int32 id = 1;
  string func = 2;
  repeated Port input_ports = 3;
  repeated Port output_ports = 4;
}

message Edge {
  int32 id = 1;
  int32 src_id = 2;
  int32 dst_id = 3;
  string src_port = 4;
  string dst_port = 5;
}

message Port {
  int32 token_rate = 1;
  int32 token_size = 2;
}
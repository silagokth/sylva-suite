syntax = "proto3";

package ss.sylva.ds;

message DataBase {
  AppGraph app_graph = 1;
  GlobalConstraint global_constraint = 2;
  RoutingGraph routing_graph = 3;
  FloorPlan floor_plan = 4;
  AlimpLibrary alimp_lib = 5;
  HyperParameter hyper_parameter = 6;
  CostMetric cost_metric = 7;
  repeated AlimpBindingOption alimp_binding_options = 8;
  SynthesizedInformation synthesized_information = 9;
}

message SynthesizedInformation {
  repeated AlimpBinding alimp_bindings = 1;
  repeated Placement placements = 2;
  int32 max_width = 3;
  int32 max_height = 4;
  repeated RoutingPath routing_paths = 5;
  int32 max_latency = 6;
  map<string, int32> node_fire_times = 7;
  map<string, int32> transporter_fire_times = 8;
  map<string, int32> channel_width = 9;
  map<string, int32> input_buffer_size = 10;
  map<string, int32> output_buffer_size = 11;
  repeated ChunkAddressAssignment chunk_address_assignments = 12;
  map<string, string> wire_assignment = 13;
  map<string, TransportTable> transport_tables = 14;
}

message TransportTable {
  string app_edge_id = 1;
  repeated TransportTableEntry entries = 2;
}

message TransportTableEntry {
  int32 time = 1;
  int32 source_address = 2;
  int32 target_address = 3;
}

message ChunkAddressAssignment {
  string app_node_id = 1;
  string port_id = 2;
  map<int32, int32> address_assignment = 3;
}

message RoutingPath {
  string app_edge_id = 1;
  repeated Coordinate path = 2;
  int32 delay = 3;
}

message Coordinate {
  int32 x = 1;
  int32 y = 2;
}

message Placement {
  string app_node_id = 1;
  int32 x = 2;
  int32 y = 3;
}

message AlimpBindingOption { repeated AlimpBinding alimp_bindings = 1; }

message AlimpBinding {
  string app_node_id = 1;
  AlimpInstance alimp_instance = 2;
}

message HyperParameter {
  int32 bind_w_area = 1;
  int32 bind_w_energy = 2;
  int32 bind_w_latency = 3;
  float bind_relaxation_factor = 4;

  float place_relaxation_factor = 5;
  int32 place_reserved_routing_size = 6;
}

message GlobalConstraint {
  int32 max_width = 1;
  int32 max_height = 2;
  int32 max_latency = 4;
  int32 max_period = 5;
  int32 max_energy = 6;
}

message CostMetric {
  int32 width = 1;
  int32 height = 2;
  int32 area = 3;
  int32 energy = 4;
  int32 latency = 5;
  int32 period = 6;
}

message AppGraph {
  repeated AppNode nodes = 1;
  repeated AppEdge edges = 2;
}
message AppNode {
  string id = 1;
  string func = 2;
  repeated AppNodePort input_ports = 3;
  repeated AppNodePort output_ports = 4;
  int32 repetition = 5;
  int32 execution_time = 6;
}

message AppNodePort {
  string id = 1;
  int32 rate = 2;
  string token_type = 3;
  int32 token_size = 4;
  repeated pair_int_int addr_time_patterns = 5;
}

message AppEdge {
  string id = 1;
  string source_node = 2;
  string target_node = 3;
  string source_port = 4;
  string target_port = 5;
  string token_type = 6;
  int32 token_size = 7;
}

message AppNodeMapping {
  string app_node_id = 1;
  string alimp_id = 2;
}

message AlimpLibrary { repeated AlimpEntry entries = 1; }

message AlimpEntry {
  string func = 1;
  repeated AlimpInstance instances = 2;
}

message AlimpInstance {
  string id = 1;
  int32 width = 2;
  int32 height = 3;
  repeated int32 input_port_positions = 4;
  repeated int32 output_port_positions = 5;
  int32 frequency = 6;
  int32 latency = 7;
  int32 power = 8;
  int32 energy = 9;
  repeated pair_int_int input_addr_time_patterns = 10;
  repeated pair_int_int output_addr_time_patterns = 11;
}

message pair_int_int {
  int32 key = 1;
  int32 value = 2;
}

message Constraints {
  int32 max_width = 1;
  int32 max_height = 2;
  int32 max_area = 3;
  float max_power = 4;
  float max_latency = 5;
  float max_period = 6;
  float data_movement_overhead = 7;
  float area_overhead = 8;
}

message FloorPlan {
  repeated string app_node_ids = 1;
  repeated string app_edge_ids = 2;
  int32 max_width = 3;
  int32 max_height = 4;
  repeated RectanglePosion pos = 5;
  repeated RectangleShape shape = 6;
  repeated int32 source_node = 7;
  repeated int32 target_node = 8;
  repeated int32 source_port = 9;
  repeated int32 target_port = 10;
  repeated int32 conn = 11;
}

message RectanglePosion {
  int32 x = 1;
  int32 y = 2;
}

message RectangleShape {
  int32 width = 1;
  int32 height = 2;
}

message RoutingGraph {
  repeated Node nodes = 1;
  repeated Edge edges = 2;
  repeated Channel channels = 3;
}

message Node {
  string id = 1;
  double weight = 2;
}

message Edge {
  string source = 1;
  string target = 2;
  double weight = 3;
}

message Channel {
  string app_edge_id = 1;
  string source = 2;
  string target = 3;
  double traffic = 4;
  repeated string path = 5;
}
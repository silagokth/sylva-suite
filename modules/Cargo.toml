[package]
name = "sylva"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "sv-lib",
    "sv-sim",
    "sv-test/config",
    "sv-test/minimum",
    "sv-test/copy"
]

[dependencies]
sv-lib = { path = "sv-lib" }
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plotters = "0.3"
rand = "0.8"
itertools = "0.12"
regex = "1"

[package]
name = "sv-asm"
version = "0.1.0"
edition = "2024"

[dependencies]
sv-lib = { path = "../sv-lib" }
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plotters = "0.3"
rand = "0.8"
itertools = "0.12"
regex = "1"
nix = "0.30.1"
libc = "0.2.174"
ndarray = "0.16.0"
tera = "1.19"
once_cell = "1"
wait-timeout = "0.2"
